# WiFi Sense Lab — Configuration
# ================================
# Shared settings for backend, scripts, and reference for firmware.
# ESP32 WiFi credentials are now managed via the dashboard (serial commands).

serial:
  port: "/dev/cu.usbserial-0001"
  baud_rate: 921600

wifi:
  scan_timeout: 15
  connect_timeout: 20

room:
  width: 4.0      # meters
  length: 5.0     # meters

csi:
  num_subcarriers: 64   # ESP32 typically provides up to 64 subcarriers
  sample_rate_hz: 100   # target CSI packets per second

detection:
  threshold: 1.2            # legacy fallback
  threshold_multiplier: 1.5
  calibration_seconds: 15
  num_subcarriers: 64
  sample_rate: 5
  buffer_seconds: 30
  mvs_window_seconds: 2
  num_selected_subcarriers: 12
  movement_thresholds:
    quiet: 5
    light: 30
  mac_filter: "auto"  # "auto" = use connected AP's BSSID

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:3002"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:3002"

plot:
  update_interval_ms: 100
  max_history_seconds: 30
